spring.application.name=backend

# ============================================================
#  PostgreSQL bağlantısı (Docker Compose'daki "postgres" servisi)
# ============================================================
# jdbc:postgresql://<host>:<port>/<veritabanı-adı>
spring.datasource.url=jdbc:postgresql://localhost:5432/commerce
spring.datasource.username=commerce
# Parola: ortam değişkeni DB_PASSWORD varsa onu kullan; yoksa lokal varsayılan.
# Böylece gerçek sırrı koda gömmüyoruz; sunucuda DB_PASSWORD ile geçilir.
spring.datasource.password=${DB_PASSWORD:commerce_local_dev}

# ============================================================
#  JPA / Hibernate
# ============================================================
# Şemayı (tabloları) Flyway yönetecek; Hibernate kendi kafasına göre
# tablo OLUŞTURMASIN, sadece var olanı doğrulasın:
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ============================================================
#  Flyway (veritabanı migration aracı - Adım 5'te kullanacağız)
# ============================================================
spring.flyway.enabled=true

# ============================================================
#  Redis bağlantısı (Docker Compose'daki "redis" servisi)
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ============================================================
#  Actuator - "uygulama sağlıklı mı?" uçları
# ============================================================
# /actuator/health ucunu açar ve detayları gösterir
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ============================================================
#  JWT (giriş jetonu) ayarları
# ============================================================
# İmza için gizli anahtar. Sunucuda JWT_SECRET ile geçilir; lokalde varsayılan.
# (En az 32 karakter olmalı - HS256 imzası bunu ister.)
app.jwt.secret=${JWT_SECRET:local-dev-jwt-secret-en-az-32-karakter-olmali-1234567890}
# Jetonun geçerlilik süresi (milisaniye). 3600000 = 1 saat.
app.jwt.expiration-ms=3600000
